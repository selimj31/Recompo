<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b4e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recompo">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Recompo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a phone-first coaching app — sticky tab bar, one view at a time, dense cards with big tabular numbers. */
:root{
  --bg:#f3f0ea;        /* chalk */
  --panel:#fbfaf7;
  --ink:#1b1a17;
  --muted:#6b675d;
  --line:#dcd6c9;
  --accent:#0f6b4e;    /* gym green */
  --accent-ink:#ffffff;
  --accent-soft:#dcefe5;
  --warn:#b7791f;
  --bad:#b23a2a;
  --good:#1f7a4d;
  --chip:#e8e3d8;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141412;--panel:#1d1d1a;--ink:#efece5;--muted:#a19c91;--line:#33322e;
  --accent:#3fbf8a;--accent-ink:#0d1a14;--accent-soft:#1a3328;--warn:#e0a648;--bad:#e46b5a;--good:#4fc985;--chip:#2a2926;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141412;--panel:#1d1d1a;--ink:#efece5;--muted:#a19c91;--line:#33322e;
  --accent:#3fbf8a;--accent-ink:#0d1a14;--accent-soft:#1a3328;--warn:#e0a648;--bad:#e46b5a;--good:#4fc985;--chip:#2a2926;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
h1,h2,h3{font-family:var(--display);font-variation-settings:"wdth" 88;font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.05}
h2{font-size:20px;margin-block:22px 10px}
h3{font-size:16px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-variation-settings:"wdth" 100;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;margin:0 -2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
nav.tabs a.on{background:var(--ink);color:var(--bg)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .v{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin-top:4px}
.kpi .d{font-size:12px;margin-top:6px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip)}
.pill.good{background:var(--accent-soft);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field{min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tscroll{overflow-x:auto}
.rest{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:14px;z-index:19;display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.rest b{font-family:var(--display);font-size:22px}
.rest button{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 40%,transparent);background:transparent}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;transition:opacity .25s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.day .n{font-family:var(--display);font-weight:800;font-size:13px}
.day.train{background:var(--accent-soft);border-color:transparent}
.day .t{font-size:11px;color:var(--muted);line-height:1.2;margin-top:3px}
.ex{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .meta{font-size:13px;color:var(--muted)}
.ex .cue{font-size:13px;margin-top:3px}
.ex .sr{font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap;text-align:right}
.ex .sr small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 70px;gap:6px;align-items:center;margin-top:8px}
.sets .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets .i{font-family:var(--display);font-weight:800;color:var(--muted);text-align:center}
.sets .last{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stage{border-left:4px solid var(--line);padding:8px 12px;margin-bottom:10px}
.stage.on{border-left-color:var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.stage.done{border-left-color:var(--good);opacity:.8}
.stage ul{margin:6px 0 0;padding-left:18px}
.stage li{margin-bottom:3px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .l1{stroke:var(--accent);stroke-width:2.2;fill:none}
.chart .a1{fill:var(--accent);opacity:.12}
.chart .l2{stroke:var(--warn);stroke-width:2.2;fill:none}
.chart .pt{fill:var(--accent)}
.chart .pt2{fill:var(--warn)}
.chart .tg{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.hint{font-size:13px;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.fig{display:inline-block;vertical-align:middle}
.fig .m{fill:var(--chip);stroke:var(--line);stroke-width:.6}
.fig .hi{fill:var(--accent)}
details summary{cursor:pointer;font-weight:600}
.pic{flex:0 0 auto;width:112px;height:84px;background:var(--chip);border-radius:10px}
.pic .b{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.pic .hd{fill:var(--ink)}
.pic .pr{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.pic .pf{fill:var(--line);stroke:var(--muted);stroke-width:1}
.pic .w{fill:var(--muted)}
.pic .ar{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pic .ah{fill:var(--accent)}
.exrow{display:flex;gap:12px;align-items:flex-start}
.exrow>div:last-child{min-width:0;flex:1}
.vid{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;margin-top:4px}
.vid:hover{text-decoration:underline}
.rehab-ex{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.rehab-ex:last-child{border-bottom:0}
.rehab-ex .pic{width:84px;height:63px}
.pic.photo{object-fit:cover}
.viswrap{display:flex;flex-direction:column;gap:4px;flex:0 0 auto;align-items:center}
.photo-btn{padding:3px 8px;font-size:11px}
.warm{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.warm b{font-family:var(--display)}
.sets .i.w{color:var(--accent)}
@media (max-width:480px){.pic{width:92px;height:69px}}
.pain{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.pain button{padding:8px 0;font-family:var(--display);font-weight:800}
.pain button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:480px){.week .t{display:none}.kpi .v{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Recomposition · adducteur gauche</div>
      <h1>Recompo 6 semaines</h1>
    </div>
    <div id="status" class="small muted">Connexion…</div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#bord" data-v="bord">Bord</a>
    <a href="#programme" data-v="programme">Programme</a>
    <a href="#seance" data-v="seance">Séance</a>
    <a href="#corps" data-v="corps">Corps</a>
    <a href="#adducteur" data-v="adducteur">Adducteur</a>
    <a href="#reglages" data-v="reglages">Objectifs</a>
  </nav>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="rest" class="rest" hidden></div>

<script>
/* ---------- Programme ---------- */
const PROGRAM = {
  goal: "Prendre du muscle, affiner la ceinture abdominale, guérir l'adducteur gauche.",
  days: ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"],
  week: {1:"C",2:"A",4:"B",5:"D"},   // index jour -> séance (Mar C, Mer A, Ven B, Sam D — repos Jeu, Dim, Lun)
  warmup: {title:"Échauffement — 8 à 10 min",opts:["Vélo (résistance faible, 80–90 tr/min)","Tapis en marche rapide (5,5–6 km/h, pente 2–4 %)"],cue:"Objectif : être en légère sueur, jamais essoufflé. Puis 2 séries d'échauffement sur le premier exercice de la séance (cf. séries É1 / É2) avant tes séries de travail."},
  abs: "Abdos : un bloc intensif à la fin de chaque séance (3 exercices, charges qui montent) + le circuit E « Abdos intensifs » 1 à 2 fois par semaine sur un jour off (dimanche ou lundi). Jeudi : repos complet, adducteur seulement. Pas de relevés de jambes tendues ni de sit-ups complets tant que l'adducteur n'est pas au stade 3 : ils tirent sur le pubis.",
  cardio: "Marche rapide inclinée 20–25 min après chaque séance (tapis 5–8 % ou extérieur). Jours off : 30 min de marche. Pas de course ni de padel tant que l'adducteur n'est pas au stade 4.",
  templates: {
    A:{name:"Pectoraux · Triceps · Gainage",color:"A",muscles:["pecs","triceps","abs"],dur:"60–75 min",
      ex:[
        {n:"Développé couché barre",s:4,r:"6–8",rest:"2 min 30",cue:"Omoplates serrées, pieds ancrés. Barre vers le bas des pecs.",m:"pecs"},
        {n:"Développé incliné haltères",s:3,r:"8–10",rest:"2 min",cue:"Banc à 30°. Coudes à 45° du buste.",m:"pecs"},
        {n:"Écarté poulie vis-à-vis",s:3,r:"12–15",rest:"75 s",cue:"Légère flexion des coudes, contracte 1 s en fin de mouvement.",m:"pecs"},
        {n:"Dips assistés ou barres parallèles",s:3,r:"8–12",rest:"2 min",cue:"Buste droit pour cibler les triceps. Descends jusqu'à 90°.",m:"triceps"},
        {n:"Extension triceps poulie corde",s:3,r:"12–15",rest:"60 s",cue:"Coudes collés au corps, écarte la corde en bas.",m:"triceps"},
        {n:"Roulette abdos à genoux (ab wheel)",s:3,r:"8–12",rest:"60 s",cue:"Bassin rentré, va aussi loin que tu tiens le dos plat. Sans roulette : barre chargée qui roule.",m:"abs",bw:true},
        {n:"Hollow hold",s:3,r:"20–30 s",rest:"45 s",cue:"Allongé, bas du dos collé au sol, bras et jambes tendus décollés. Plie les genoux si l'aine tire.",m:"abs",bw:true},
        {n:"Planche frontale",s:3,r:"45–60 s",rest:"45 s",cue:"Fessiers serrés, bassin rentré. Stoppe si tiraillement à l'aine.",m:"abs",bw:true}
      ]},
    B:{name:"Dos · Biceps · Gainage",color:"B",muscles:["dos","biceps","abs"],dur:"60–75 min",
      ex:[
        {n:"Tractions ou tirage vertical",s:4,r:"6–10",rest:"2 min 30",cue:"Tire les coudes vers les hanches. Poitrine haute.",m:"dos"},
        {n:"Rowing barre ou haltère",s:4,r:"8–10",rest:"2 min",cue:"Dos plat, pas de balancier. Rowing haltère si gêne à l'aine.",m:"dos"},
        {n:"Tirage horizontal poulie",s:3,r:"10–12",rest:"90 s",cue:"Serre les omoplates 1 s en fin de tirage.",m:"dos"},
        {n:"Face pull",s:3,r:"15",rest:"60 s",cue:"Corde vers le front, coudes hauts. Épaules saines = progression durable.",m:"dos"},
        {n:"Curl barre EZ",s:3,r:"8–10",rest:"90 s",cue:"Coudes fixes. Descends sous contrôle (3 s).",m:"biceps"},
        {n:"Curl marteau haltères",s:3,r:"10–12",rest:"60 s",cue:"Alterné ou simultané. Pas d'élan du buste.",m:"biceps"},
        {n:"Pallof press (anti-rotation)",s:3,r:"12/côté",rest:"45 s",cue:"Poulie à hauteur du sternum, bras tendus devant toi, résiste à la rotation. Monte la charge chaque semaine.",m:"abs",bw:true},
        {n:"Crunch poulie à genoux",s:4,r:"12–15",rest:"60 s",cue:"Lourd. Enroule le buste vers les genoux, hanches fixes. +2,5 kg dès que 15 reps propres.",m:"abs"},
        {n:"Planche latérale avec hip dips",s:3,r:"12/côté",rest:"45 s",cue:"En planche latérale, descends la hanche vers le sol et remonte. Côté gauche : stoppe si douleur à l'aine.",m:"abs",bw:true}
      ]},
    C:{name:"Épaules · Bras · Abdos",color:"C",muscles:["epaules","biceps","triceps","abs"],dur:"60–70 min",
      ex:[
        {n:"Développé militaire haltères assis",s:4,r:"6–8",rest:"2 min 30",cue:"Dossier légèrement incliné. Pas de cambrure.",m:"epaules"},
        {n:"Élévations latérales",s:4,r:"12–15",rest:"60 s",cue:"Léger, coudes un peu fléchis, monte jusqu'à l'horizontale.",m:"epaules"},
        {n:"Oiseau (arrière d'épaule) poulie ou haltères",s:3,r:"12–15",rest:"60 s",cue:"Buste penché, tire vers l'extérieur.",m:"epaules"},
        {n:"Curl incliné haltères",s:3,r:"10–12",rest:"75 s",cue:"Bras en arrière du buste, étirement complet.",m:"biceps"},
        {n:"Extension triceps au-dessus de la tête",s:3,r:"10–12",rest:"75 s",cue:"Coudes serrés, étirement complet en bas.",m:"triceps"},
        {n:"Superset : curl + extension poulie",s:2,r:"15 + 15",rest:"60 s",cue:"Finisher bras, léger, sans repos entre les deux.",m:"biceps"},
        {n:"Planche latérale",s:3,r:"25–40 s/côté",rest:"45 s",cue:"Hanche haute. Côté gauche d'abord, stoppe si douleur à l'aine.",m:"abs",bw:true},
        {n:"Crunch poulie à genoux",s:4,r:"10–12",rest:"60 s",cue:"Plus lourd que la séance B. Enroule le buste, hanches fixes.",m:"abs"},
        {n:"Crunch inversé sur banc",s:3,r:"12–15",rest:"45 s",cue:"Genoux pliés, enroule le bassin vers la poitrine sans élan. Amplitude réduite tant que l'adducteur n'est pas au stade 3.",m:"abs",bw:true}
      ]},
    D:{name:"Haut du corps complet · Cardio",color:"D",muscles:["pecs","dos","epaules","abs"],dur:"70–85 min",
      ex:[
        {n:"Développé couché haltères",s:4,r:"8–10",rest:"2 min",cue:"Amplitude complète, contrôle la descente.",m:"pecs"},
        {n:"Rowing poulie basse",s:4,r:"10–12",rest:"90 s",cue:"Buste fixe, coudes vers l'arrière.",m:"dos"},
        {n:"Développé incliné machine ou barre",s:3,r:"10–12",rest:"90 s",cue:"Tempo 2 s descente / 1 s montée.",m:"pecs"},
        {n:"Tirage vertical prise serrée",s:3,r:"10–12",rest:"90 s",cue:"Poitrine vers la barre.",m:"dos"},
        {n:"Développé Arnold",s:3,r:"10–12",rest:"75 s",cue:"Rotation progressive, sans à-coup.",m:"epaules"},
        {n:"Shrugs haltères",s:3,r:"12–15",rest:"60 s",cue:"Monte droit vers les oreilles, tiens 1 s.",m:"epaules"},
        {n:"Dead bug lesté",s:3,r:"10/côté",rest:"45 s",cue:"Haltère 4–6 kg dans les mains, mouvement lent (3 s). Stoppe si tension au pubis.",m:"abs"},
        {n:"Roulette abdos à genoux (ab wheel)",s:3,r:"10–12",rest:"60 s",cue:"Progression : plus loin chaque semaine, puis 1 s de pause en bout de course.",m:"abs",bw:true},
        {n:"Mountain climbers lents",s:3,r:"20",rest:"45 s",cue:"En planche, ramène un genou à la fois, lentement, bassin stable. Amplitude réduite côté gauche si gêne.",m:"abs",bw:true},
        {n:"Cardio : marche inclinée",s:1,r:"25 min",rest:"—",cue:"Tapis 6–8 %, 5,5–6 km/h. Respiration nasale possible = bonne intensité.",m:"cardio",bw:true}
      ]},
    E:{name:"Abdos intensifs (circuit 15 min)",color:"E",muscles:["abs"],dur:"15–20 min",optional:true,
      ex:[
        {n:"Crunch poulie à genoux",s:3,r:"15",rest:"—",cue:"Circuit : enchaîne les 5 exercices, 60 s de repos entre les tours, 3 tours. Charge moyenne.",m:"abs"},
        {n:"Roulette abdos à genoux (ab wheel)",s:3,r:"10",rest:"—",cue:"Dos plat, bassin rentré.",m:"abs",bw:true},
        {n:"Planche latérale avec hip dips",s:3,r:"12/côté",rest:"—",cue:"Hanche haute, descends et remonte sous contrôle.",m:"abs",bw:true},
        {n:"Hollow hold",s:3,r:"30 s",rest:"—",cue:"Bas du dos collé au sol.",m:"abs",bw:true},
        {n:"Planche frontale",s:3,r:"60 s",rest:"60 s",cue:"Dernier exercice du tour, puis 60 s de repos.",m:"abs",bw:true}
      ]}
  },
  phases:[
    {w:"Sem. 1–2",t:"Apprentissage des charges",d:"Trouve tes charges de référence : la dernière rép de chaque série doit être difficile mais propre. Note tout. Abdos en gainage uniquement."},
    {w:"Sem. 3–4",t:"Surcharge progressive",d:"Quand tu atteins le haut de la fourchette de reps sur toutes les séries : +2,5 kg (haltères/isolation) ou +5 kg (barre). L'appli te le signale."},
    {w:"Sem. 5–6",t:"Intensification",d:"Ajoute une série sur le premier exercice de chaque séance. Cardio porté à 30 min. Abdos : crunch poulie plus lourd, ab wheel plus loin, planches plus longues."}
  ]
};

/* ---------- Pictogrammes (vue de profil, sauf mention) ---------- */
const FLOOR='<line class="pr" x1="4" y1="84" x2="116" y2="84"/>';

  return `<svg class="pic" viewBox="0 0 120 90" aria-hidden="true">${(p.props||[]).join("")}${p.segs.map(s=>`<polyline class="b" points="${s.map(q=>q.join(",")).join(" ")}"/>`).join("")}<circle class="hd" cx="${p.head[0]}" cy="${p.head[1]}" r="6"/>${p.arrow?ah(p.arrow):""}${p.arrow2?ah(p.arrow2):""}</svg>`;
}

function refresh(){
  const d=loadData();
  const list=(k)=>Object.entries(d[k]||{}).map(([id,v])=>({id,...v}));
  S.sessions=list("sessions").sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.createdAt||"")<(a.createdAt||"")?-1:1);
  S.body=list("body").sort((a,b)=>a.date<b.date?-1:1);
  S.rehab=list("rehab").sort((a,b)=>a.date<b.date?-1:1);
  S.profile=(d.settings||{}).profile||null;
}
const db={
  doc(path){ const [col,id]=path.split("/"); return {
    async set(v){ const d=loadData(); (d[col]=d[col]||{})[id]=v; saveData(d); refresh(); render(); },
    async delete(){ const d=loadData(); if(d[col]) delete d[col][id]; saveData(d); refresh(); render(); } } },
  collection(col){ return { async add(v){ const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6); await db.doc(col+"/"+id).set(v); return {id}; } } }
};
/* Photos : IndexedDB (plus de place que localStorage) */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("recompo-media",1); r.onupgradeneeded=()=>r.result.createObjectStore("media"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function mediaAll(){ try{ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction("media").objectStore("media"); const out={}; const c=t.openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } else res(out); }; c.onerror=()=>rej(c.error); }); }catch(e){ return {} } }
async function mediaPut(k,v){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction("media","readwrite"); t.objectStore("media").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
function shrink(file,max=900){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.82)); }; img.onerror=rej; img.src=u; }); }

}
async function pickPhoto(name){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.addEventListener("change",async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    toast("Enregistrement de la photo…");
    try{ const dataUrl=await shrink(f); const key=slug(name); await mediaPut(key,{name,dataUrl,at:new Date().toISOString()}); S.media[key]={name,dataUrl}; render(); toast("Photo ajoutée"); }
    catch(e){ console.error(e); toast("Photo impossible à enregistrer"); }
  });
  inp.click();
}

function importBackup(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.addEventListener("change",()=>{ const f=inp.files&&inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); const d=o.data||o; if(!d||typeof d!=="object") throw 0; saveData(d); refresh(); render(); toast("Sauvegarde restaurée"); }catch(e){ toast("Fichier invalide"); } }; r.readAsText(f); });
  inp.click();
}
/* Minuteur de repos */
let restT=null;
function startRest(sec,label){
  clearInterval(restT); let left=sec; const el=$("#rest"); el.hidden=false;
  const draw=()=>{ el.innerHTML=`<b>${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</b> <span>${esc(label)}</span> <button type="button" class="ghost small" data-rest-stop>Stop</button>`; el.querySelector("[data-rest-stop]").onclick=()=>{clearInterval(restT);el.hidden=true}; };
  draw();
  restT=setInterval(()=>{ left--; if(left<=0){ clearInterval(restT); el.innerHTML=`<b>Go !</b> <span>${esc(label)}</span> <button type="button" class="ghost small" data-rest-stop>OK</button>`; el.querySelector("[data-rest-stop]").onclick=()=>el.hidden=true; try{ navigator.vibrate&&navigator.vibrate([200,100,200,100,400]); }catch(e){} beep(); } else draw(); },1000);
}
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(); const g=a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value=880; g.gain.value=0.15; o.start(); setTimeout(()=>{o.stop();a.close()},350); }catch(e){} }
function restSeconds(r){ const m=String(r).match(/(\d+)\s*min(?:\s*(\d+))?/); if(m) return +m[1]*60+(+m[2]||0); const s=String(r).match(/(\d+)\s*s/); return s?+s[1]:90; }

const VIEWS=["bord","programme","seance","corps","adducteur","reglages"];
function route(){const h=location.hash.replace("#","");S.view=VIEWS.includes(h)?h:"bord";document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===S.view));render();window.scrollTo(0,0)}

/* ---------- Derived ---------- */
function prof(){return Object.assign({height:170,startWeight:68,targetWeight:68,targetWaist:null,startWaist:null,startDate:today()},S.profile||{})}
function lastSetsFor(name){ for(const s of S.sessions){ const e=(s.exercises||[]).find(x=>x.name===name); if(e&&work(e.sets).length) return {sets:work(e.sets),date:s.date}; } return null; }
function suggestion(ex){
  const last=lastSetsFor(ex.n); if(!last) return {kg:null,txt:"Première fois : trouve ta charge de référence."};
  const top=parseTop(ex.r); const kgs=last.sets.map(s=>+s.kg||0); const maxKg=Math.max(...kgs);
  if(ex.bw) return {kg:maxKg||0,txt:"Dernière fois : "+last.sets.map(s=>s.reps).join(" / ")+" ("+fmtD(last.date)+")."};
  const allTop = top && last.sets.every(s=>(+s.reps||0)>=top);
  const inc = /barre|couché barre|militaire/i.test(ex.n)?2.5:2.5;
  if(allTop) return {kg:maxKg+inc,txt:"Toutes les séries au max de reps le "+fmtD(last.date)+" → passe à "+n1(maxKg+inc)+" kg.",up:true};
  return {kg:maxKg,txt:"Reste à "+n1(maxKg)+" kg, vise le haut de la fourchette ("+last.sets.map(s=>s.reps).join("/")+" la dernière fois)."};
}
function weekSessions(){const m=monday();const iso=m.toISOString().slice(0,10);return S.sessions.filter(s=>s.date>=iso&&s.template!=="E")}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function bodyStat(){
  const w=S.body.filter(b=>b.weight!=null); const wa=S.body.filter(b=>b.waist!=null);
  const last7=w.slice(-7).map(b=>+b.weight); const prev7=w.slice(-14,-7).map(b=>+b.weight);
  return {w7:avg(last7),wPrev:avg(prev7),lastW:w.length?+w[w.length-1].weight:null,firstW:w.length?+w[0].weight:null,
          lastWaist:wa.length?+wa[wa.length-1].waist:null,firstWaist:wa.length?+wa[0].waist:null};
}
function rehabStat(){
  const r=S.rehab; const stage=r.length?+r[r.length-1].stage||1:1;
  let streak=0; for(let i=r.length-1;i>=0;i--){ if((+r[i].pain||0)<=1 && +r[i].stage===stage) streak++; else break; }
  const lastPain=r.length?+r[r.length-1].pain:null;
  return {stage,streak,lastPain,ready:streak>=3&&stage<4};
}
function prs(){
  const best={}; const copy=[...S.sessions].sort((a,b)=>a.date<b.date?-1:1);
  const out=[];
  for(const s of copy) for(const e of (s.exercises||[])) for(const st of work(e.sets)){
    const v=e1rm(+st.kg||0,+st.reps||0); if(!v) continue;
    if(!best[e.name]||v>best[e.name].v+0.01){ if(best[e.name]) out.push({name:e.name,date:s.date,kg:+st.kg,reps:+st.reps,v}); best[e.name]={v,date:s.date,kg:+st.kg,reps:+st.reps}; }
  }
  return {best,recent:out.sort((a,b)=>a.date<b.date?1:-1).slice(0,5)};
}

  bind();
}

function chartBody(){
  const w=S.body.filter(b=>b.weight!=null), wa=S.body.filter(b=>b.waist!=null);
  if(w.length<2 && wa.length<2) return '<span class="muted">Le graphique apparaît à partir de deux mesures.</span>';
  const p=prof(); const W=640,H=220,L=40,R=40,T=14,B=28;
  const all=S.body.map(b=>b.date); const x0=new Date(all[0]+"T12:00:00").getTime(), x1=Math.max(new Date(all[all.length-1]+"T12:00:00").getTime(),x0+6*864e5);
  const X=iso=>L+(new Date(iso+"T12:00:00").getTime()-x0)/(x1-x0)*(W-L-R);
  const wv=w.map(b=>+b.weight).concat(p.targetWeight?[+p.targetWeight]:[]); const wmin=Math.floor(Math.min(...wv)-1), wmax=Math.ceil(Math.max(...wv)+1);
  const Y=v=>T+(wmax-v)/(wmax-wmin)*(H-T-B);
  const wav=wa.map(b=>+b.waist).concat(p.targetWaist?[+p.targetWaist]:[]); const amin=wav.length?Math.floor(Math.min(...wav)-1):0, amax=wav.length?Math.ceil(Math.max(...wav)+1):1;
  const Y2=v=>T+(amax-v)/(amax-amin||1)*(H-T-B);
  const ticks=[];for(let v=wmin;v<=wmax;v+=Math.max(1,Math.round((wmax-wmin)/4)))ticks.push(v);
  const pts=w.map(b=>X(b.date)+","+Y(+b.weight)).join(" ");
  const area=w.length>1?`M${X(w[0].date)},${H-B} L${pts.replace(/ /g," L")} L${X(w[w.length-1].date)},${H-B} Z`:"";
  const pts2=wa.map(b=>X(b.date)+","+Y2(+b.waist)).join(" ");
  const dates=[]; const n=Math.min(6,all.length); for(let i=0;i<n;i++){const d=all[Math.round(i*(all.length-1)/Math.max(1,n-1))]; if(!dates.includes(d))dates.push(d)}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Poids et tour de taille dans le temps">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join("")}
    ${p.targetWeight?`<line class="tg" x1="${L}" x2="${W-R}" y1="${Y(+p.targetWeight)}" y2="${Y(+p.targetWeight)}"/>`:""}
    ${w.length>1?`<path class="a1" d="${area}"/><polyline class="l1" points="${pts}"/>`:""}
    ${w.map(b=>`<circle class="pt" cx="${X(b.date)}" cy="${Y(+b.weight)}" r="3"/>`).join("")}
    ${wa.length>1?`<polyline class="l2" points="${pts2}"/>`:""}
    ${wa.map(b=>`<circle class="pt2" cx="${X(b.date)}" cy="${Y2(+b.waist)}" r="3"/>`).join("")}
    ${wa.length?`<text x="${W-R+6}" y="${Y2(amax)+4}">${amax}</text><text x="${W-R+6}" y="${Y2(amin)+4}">${amin}</text>`:""}
    ${dates.map(d=>`<text x="${X(d)}" y="${H-8}" text-anchor="middle">${fmtD(d)}</text>`).join("")}
  </svg><div class="legend"><span><i style="background:var(--accent)"></i>Poids (kg, échelle gauche)</span><span><i style="background:var(--warn)"></i>Tour de taille (cm, échelle droite)</span>${p.targetWeight?'<span><i style="background:var(--muted)"></i>Cible poids</span>':''}</div>`;
}

function adducteur(){
  const rs=rehabStat(); const t=today(); const ex=S.rehab.find(r=>r.date===t)||{};
  const pain=ex.pain??null;
  return `<div class="hint">Ce protocole suit la logique de ton coaching précédent (J+11 après rechute au padel, douleur haute près du pubis). Il ne remplace pas un examen : un médecin du sport ou un kiné doit valider le passage au stade 3. Douleur &gt; 3/10 pendant ou dans les 24 h → tu redescends d'un stade.</div>
  <h2>Bilan du jour</h2>
  <div class="card">
    <div class="fields"><div class="field"><label for="rdate">Date</label><input id="rdate" type="date" value="${t}"></div><div class="field"><label for="rstage">Stade suivi aujourd'hui</label><select id="rstage">${[1,2,3,4].map(n=>`<option value="${n}" ${(+ex.stage||rs.stage)===n?'selected':''}>Stade ${n} — ${REHAB[n-1].t}</option>`).join("")}</select></div></div>
    <label style="margin-top:10px">Douleur max ressentie (pendant, 2 h après, lendemain matin)</label>
    <div class="pain" id="pain">${Array.from({length:11},(_,i)=>`<button type="button" data-pain="${i}" class="${pain===i?'sel':''}">${i}</button>`).join("")}</div>
    <div class="row" style="margin-top:10px"><label style="margin:0" class="row"><input type="checkbox" id="rdone" style="width:auto" ${ex.done?'checked':''}> Exercices du stade faits</label></div>
    <div class="field" style="margin-top:8px"><label for="rnote">Note (localisation, palpation, marche…)</label><input id="rnote" value="${esc(ex.note||'')}"></div>
    <button class="primary" style="margin-top:10px" data-save-rehab ${ro()?'disabled':''}>Enregistrer le bilan</button>
  </div>
  <h2>Où tu en es</h2>
  <div class="card row spread"><div><b>Stade ${rs.stage} — ${REHAB[rs.stage-1].t}</b><div class="small muted">${rs.streak} jour${rs.streak>1?'s':''} consécutif${rs.streak>1?'s':''} à douleur ≤ 1 sur ce stade</div></div>${rs.ready?`<span class="pill good">Critère atteint : passe au stade ${rs.stage+1}</span>`:`<span class="pill">${rs.stage<4?'Encore '+Math.max(0,3-rs.streak)+' j sans douleur':'Retour au sport en cours'}</span>`}</div>
  <h2>Les 4 stades</h2>
  ${REHAB.map(st=>`<div class="stage ${st.n===rs.stage?'on':st.n<rs.stage?'done':''}"><div class="row spread"><b>Stade ${st.n} — ${st.t}</b>${st.n<rs.stage?'<span class="pill good">validé</span>':st.n===rs.stage?'<span class="pill good">en cours</span>':''}</div><div class="small muted">Critère d'entrée : ${st.crit}</div><div style="margin-top:6px">${st.ex.map(e=>`<div class="rehab-ex">${visual(e[0].split(" :")[0],e[1])}<div class="small"><div>${e[0]}</div>${vid(e[2])}</div></div>`).join("")}</div></div>`).join("")}
  <h2>Historique douleur</h2>
  <div class="card">${chartPain()}</div>`;
}
function chartPain(){
  const r=S.rehab; if(r.length<2) return '<span class="muted">Le graphique apparaît à partir de deux bilans.</span>';
  const W=640,H=160,L=30,R=10,T=10,B=26; const x0=new Date(r[0].date+"T12:00:00").getTime(), x1=Math.max(new Date(r[r.length-1].date+"T12:00:00").getTime(),x0+6*864e5);
  const X=iso=>L+(new Date(iso+"T12:00:00").getTime()-x0)/(x1-x0)*(W-L-R); const Y=v=>T+(10-v)/10*(H-T-B);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Douleur à l'adducteur dans le temps">
  ${[0,3,5,10].map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join("")}
  <line class="tg" x1="${L}" x2="${W-R}" y1="${Y(1)}" y2="${Y(1)}"/>
  <polyline class="l1" points="${r.map(b=>X(b.date)+","+Y(+b.pain||0)).join(" ")}"/>
  ${r.map(b=>`<circle class="pt" cx="${X(b.date)}" cy="${Y(+b.pain||0)}" r="3"/><text x="${X(b.date)}" y="${H-8}" text-anchor="middle">${fmtD(b.date)}</text>`).join("")}
  </svg><div class="legend"><span><i style="background:var(--accent)"></i>Douleur /10</span><span><i style="background:var(--muted)"></i>Seuil 1/10 pour progresser</span></div>`;
}

function reglages(){
  const p=prof();
  return `<h2>Objectifs sur 6 semaines</h2>
  <div class="card"><div class="fields">
    <div class="field"><label for="pstart">Date de départ</label><input id="pstart" type="date" value="${p.startDate}"></div>
    <div class="field"><label for="ph">Taille (cm)</label><input id="ph" type="number" value="${p.height}"></div>
    <div class="field"><label for="psw">Poids de départ (kg)</label><input id="psw" type="number" step="0.1" value="${p.startWeight}"></div>
    <div class="field"><label for="ptw">Poids cible à 6 sem. (kg)</label><input id="ptw" type="number" step="0.1" value="${p.targetWeight}"></div>
    <div class="field"><label for="psa">Tour de taille de départ (cm)</label><input id="psa" type="number" step="0.5" value="${p.startWaist??''}"></div>
    <div class="field"><label for="pta">Tour de taille cible (cm)</label><input id="pta" type="number" step="0.5" value="${p.targetWaist??''}" placeholder="départ − 3 à 4"></div>
  </div>
  <p class="small muted" style="margin:10px 0">Recomposition : poids stable à ±1 kg, tour de taille qui baisse de 0,5 cm par semaine, charges qui montent. Si le poids chute de plus de 0,5 kg/semaine, tu manges trop peu pour construire du muscle. Protéines : 1,8–2 g/kg, soit ~130 g/jour.</p>
  <button class="primary" data-save-profile ${ro()?'disabled':''}>Enregistrer</button></div>
  <h2>Sauvegarde</h2>
  <div class="card"><p class="small muted" style="margin:0 0 10px">Tes données sont stockées sur cet appareil uniquement. Fais une sauvegarde de temps en temps (le fichier arrive dans Fichiers / Téléchargements) ; tu peux la restaurer sur un autre appareil.</p><div class="row"><button data-export>⬇️ Exporter une sauvegarde</button><button class="ghost" data-import>⬆️ Restaurer</button></div></div>
  <h2>Nutrition en 5 règles</h2>
  <div class="card small"><ol style="margin:0;padding-left:18px"><li><b>130 g de protéines par jour</b>, réparties sur 3–4 repas (poulet, poisson, œufs, skyr, viande maigre).</li><li><b>Calories de maintien</b> au départ (≈ 2 300–2 500 kcal pour 68 kg et 4 séances), puis −150 kcal si le tour de taille ne bouge pas après 2 semaines.</li><li><b>Glucides autour des séances</b> (riz, pommes de terre, pain complet), moins les jours off.</li><li><b>Légumes à chaque repas</b> et 2–3 L d'eau. Sodas, jus et alcool : zéro pendant les 6 semaines.</li><li><b>Restaurant :</b> protéine + légumes + un féculent, sauces à part, pas de dessert en semaine.</li></ol></div>`;
}

/* ---------- Bindings ---------- */
function bind(){
  const v=$("#view");
  v.querySelectorAll("[data-start]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();startDraft(b.dataset.start);if(location.hash!=="#seance")location.hash="#seance";else render();}));
  v.querySelector("[data-cancel]")?.addEventListener("click",()=>{S.draft=null;lsSet("draft","");render()});
  v.querySelectorAll("input[data-ex]").forEach(i=>i.addEventListener("input",()=>{const st=S.draft.exercises[+i.dataset.ex].sets[+i.dataset.set];st[i.dataset.f]=i.value===""?null:+i.value;saveDraft()}));
  v.querySelectorAll("[data-addset]").forEach(b=>b.addEventListener("click",()=>{S.draft.exercises[+b.dataset.addset].sets.push({kg:null,reps:null});saveDraft();render()}));
  ["sdate","sdur","sfeel","snotes"].forEach(id=>{const el=v.querySelector("#"+id);if(el)el.addEventListener("input",()=>{S.draft[{sdate:"date",sdur:"durationMin",sfeel:"feel",snotes:"notes"}[id]]=el.value;saveDraft()})});
  v.querySelector("[data-save-session]")?.addEventListener("click",saveSession);
  v.querySelectorAll("[data-del-session]").forEach(b=>b.addEventListener("click",()=>confirmBtn(b,async()=>{await write(()=>S.db.doc("sessions/"+b.dataset.delSession).delete(),"Séance supprimée")})));
  v.querySelector("[data-save-body]")?.addEventListener("click",saveBody);
  v.querySelectorAll("[data-del-body]").forEach(b=>b.addEventListener("click",()=>confirmBtn(b,async()=>{await write(()=>S.db.doc("body/"+b.dataset.delBody).delete(),"Mesure supprimée")})));
  v.querySelectorAll("[data-pain]").forEach(b=>b.addEventListener("click",()=>{v.querySelectorAll("[data-pain]").forEach(x=>x.classList.toggle("sel",x===b))}));
  v.querySelector("[data-save-rehab]")?.addEventListener("click",saveRehab);
  v.querySelector("[data-save-profile]")?.addEventListener("click",saveProfile);
  v.querySelectorAll("[data-rest]").forEach(b=>b.addEventListener("click",()=>startRest(+b.dataset.rest,b.dataset.restLabel)));
  v.querySelector("[data-export]")?.addEventListener("click",exportBackup);
  v.querySelector("[data-import]")?.addEventListener("click",importBackup);
  v.querySelectorAll("[data-photo]").forEach(b=>b.addEventListener("click",()=>pickPhoto(b.dataset.photo)));
  v.querySelectorAll("input[name=warmup]").forEach(r=>r.addEventListener("change",()=>{S.draft.warmup=r.value;saveDraft()}));
}
function confirmBtn(b,fn){ if(b.dataset.armed){fn();return} b.dataset.armed="1"; const t=b.textContent; b.textContent="Confirmer ?"; setTimeout(()=>{b.dataset.armed="";b.textContent=t},3000); }
function startDraft(k){ const s=PROGRAM.templates[k]; S.draft={template:k,date:today(),durationMin:"",feel:"",notes:"",warmup:"",exercises:s.ex.map((e,i)=>({name:e.n,sets:(i===0?[{kg:null,reps:null,warm:true},{kg:null,reps:null,warm:true}]:[]).concat(Array.from({length:e.s},()=>({kg:null,reps:null})))}))}; saveDraft(); }
const work = sets => (sets||[]).filter(s=>!s.warm);
function saveDraft(){ lsSet("draft",JSON.stringify(S.draft||"")); }
async function saveSession(){
  const d=S.draft; if(!d.date){toast("Date manquante");return}
  const exercises=d.exercises.map(e=>({name:e.name,sets:e.sets.filter(s=>s.kg!=null||s.reps!=null).map(s=>({kg:+s.kg||0,reps:+s.reps||0,...(s.warm?{warm:true}:{})}))})).filter(e=>e.sets.length);
  if(!exercises.length){toast("Aucune série remplie");return}
  const body={template:d.template,date:d.date,durationMin:d.durationMin?+d.durationMin:null,feel:d.feel||"",notes:d.notes||"",warmup:d.warmup||"",exercises,createdAt:new Date().toISOString()};
  const ok=await write(()=>S.db.collection("sessions").add(body),"Séance enregistrée 💪");
  if(ok){S.draft=null;lsSet("draft","");location.hash="#bord"}
}
async function saveBody(){
  const date=$("#bdate").value; if(!date){toast("Date manquante");return}
  const g=id=>{const x=$("#"+id).value;return x===""?null:+x};
  const body={date,weight:g("bw"),waist:g("bwaist"),chest:g("bchest"),arm:g("barm")};
  if(body.weight==null&&body.waist==null&&body.chest==null&&body.arm==null){toast("Rien à enregistrer");return}
  await write(()=>S.db.doc("body/"+date).set(body),"Mesure enregistrée");
}
async function saveRehab(){
  const date=$("#rdate").value; const sel=$("#view").querySelector("[data-pain].sel"); if(!sel){toast("Indique la douleur de 0 à 10");return}
  const body={date,pain:+sel.dataset.pain,stage:+$("#rstage").value,done:$("#rdone").checked,note:$("#rnote").value||""};
  await write(()=>S.db.doc("rehab/"+date).set(body),"Bilan enregistré");
}
async function saveProfile(){
  const g=id=>{const x=$("#"+id).value;return x===""?null:+x};
  const body={startDate:$("#pstart").value||today(),height:g("ph"),startWeight:g("psw"),targetWeight:g("ptw"),startWaist:g("psa"),targetWaist:g("pta")};
  await write(()=>S.db.doc("settings/profile").set(body),"Objectifs enregistrés");
}
try{const d=lsGet("draft");if(d){const o=JSON.parse(d);if(o&&o.template)S.draft=o}}catch(e){}
boot();
</script>
